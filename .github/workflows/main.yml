name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore
        run: dotnet restore EngExam.sln
      - name: Build
        run: dotnet build EngExam.sln --no-restore --configuration Release

  docker:
      runs-on: ubuntu-latest
      needs: build-and-test
      steps:
        - name: Checkout code
          uses: actions/checkout@v6
        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v4

        - name: Build and test
          uses: docker/build-push-action@v7
          with:
            context: .
            file: ./EngExam/Dockerfile
            target: build
            load: true
            cache-from: type=gha
            cache-to: type=gha,mode=max
        - name: Build and push
          uses: docker/build-push-action@v7
          with:
            context: .
            file: ./EngExam/Dockerfile
            push: true
            target: final
            tags: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            cache-from: type=gha
            cache-to: type=gha,mode=max
  deploy:
    name: Trigger AWS CodeDeploy
    runs-on: ubuntu-latest
    needs: build-test-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Zip and Upload artifact to S3
        run: |
          zip -r deploy-artifact.zip appspec.yml aws/
          aws s3 cp deploy-artifact.zip s3://${{ secrets.AWS_S3_BUCKET_NAME }}/engexam-ui/deploy-artifact.zip
      - name: Create AWS CodeDeploy Deployment
        run: |
          aws deploy create-deployment \
            --application-name ${{ secrets.AWS_APPLICATION_NAME }} \
            --deployment-group-name ${{ secrets.AWS_DEPLOYMENT_GROUP_NAME }} \
            --s3-location bucket=${{ secrets.AWS_S3_BUCKET_NAME }},bundleType=zip,key=engexam-ui/deploy-artifact.zip \
            --ignore-application-stop-failures