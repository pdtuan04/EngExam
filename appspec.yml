version: 0.0
os: linux
files:
  - source: /aws/compose.yaml
    destination: /usr/local/codedeployresources/
hooks:
  ApplicationStop:
    - location: aws/scripts/application-stop.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: aws/scripts/application-start.sh
      timeout: 300
      runas: root